services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: loxena-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Loxena@123"
    ports:
      - "1433:1433"
    volumes:
      - loxena_sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  loxena_sqlserver_data:
